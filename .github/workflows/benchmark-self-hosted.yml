name: Self-Hosted GPU Benchmark

on:
  workflow_dispatch:
    inputs:
      dataset_modes:
        description: "Space-separated synthetic 6DOF dataset modes, or all"
        default: "all"
        required: true
      workers:
        description: "Parallel rollout worker processes"
        default: "30"
        required: true
      regenerate_datasets:
        description: "Regenerate synthetic datasets before benchmarking"
        type: boolean
        default: false
      build_pdf:
        description: "Build latex/main.pdf after regenerating assets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: self-hosted-gpu-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify NVIDIA GPU
        run: nvidia-smi

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[gpu]" --index-url https://download.pytorch.org/whl/cu128 --extra-index-url https://pypi.org/simple

      - name: Verify PyTorch CUDA
        run: |
          .venv/bin/python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available to PyTorch")
          print("device", torch.cuda.get_device_name(0))
          PY

      - name: Resolve benchmark inputs
        id: inputs
        run: |
          DATASET_MODES="${{ inputs.dataset_modes }}"
          if [ "$DATASET_MODES" = "all" ]; then
            DATASET_MODES="open_loop sine_sweep aggressive trim_grid"
          fi
          DATASET_PATHS=""
          for mode in $DATASET_MODES; do
            DATASET_PATHS="$DATASET_PATHS work/data/aircraft_6dof_$mode"
          done
          echo "dataset_modes=$DATASET_MODES" >> "$GITHUB_OUTPUT"
          echo "dataset_paths=$DATASET_PATHS" >> "$GITHUB_OUTPUT"

      - name: Regenerate synthetic datasets
        if: ${{ inputs.regenerate_datasets }}
        run: |
          .venv/bin/python results.py simulate-6dof \
            --dataset-modes ${{ steps.inputs.outputs.dataset_modes }}

      - name: Run 6DOF benchmark suite
        run: |
          .venv/bin/python -m models.aircraft6dof.comparison_suite \
            --datasets ${{ steps.inputs.outputs.dataset_paths }} \
              data/sportcub_mocap_4_17_26_train.npz \
              data/sportcub_mocap_5_22_26_train.npz \
            --results-dir results \
            --fig-dir latex/fig \
            --table-dir latex/tables \
            --workers ${{ inputs.workers }}

      - name: Export paper and web assets
        run: |
          .venv/bin/python results.py latex-assets
          .venv/bin/python results.py web-data

      - name: Build paper
        if: ${{ inputs.build_pdf }}
        run: .venv/bin/python results.py build

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            results
            latex/tables
            latex/fig
            site/public/data
            latex/generated
            latex/fig/generated_*
            latex/main.pdf
          if-no-files-found: ignore
