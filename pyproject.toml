[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-identification-benchmark"
version = "0.1.0"
description = "Aircraft system-identification benchmark framework."
requires-python = ">=3.10"
dependencies = [
  "casadi",
  "matplotlib",
  "numpy",
  "pandas",
  "scipy",
]

[project.optional-dependencies]
gpu = [
  "torch",
]

[tool.setuptools]
py-modules = [
  "results",
]
packages = [
  "benchmark",
  "dataset_tools",
  "dataset_tools.sportcub_mocap_4_17_26",
  "dataset_tools.sportcub_mocap_5_22_26",
  "models",
  "models.aircraft6dof",
  "models.aircraft6dof.modelica",
]

[tool.setuptools.package-data]
"models.aircraft6dof.modelica" = ["*.mo", "generated/*.json"]
